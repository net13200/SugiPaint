<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SugiPaint</title>
<meta name="description" content="A big, bright, super simple drawing app for little artists." />
<meta name="theme-color" content="#ff5e8a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="splash" role="status" aria-label="SugiPaint is loading">
  <svg id="kanji-svg" viewBox="0 0 100 100" width="160" height="160" aria-hidden="true">
    <defs>
      <linearGradient id="brushGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff5e8a" />
        <stop offset="100%" stop-color="#7c5cff" />
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#brushGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path class="kanji-stroke" d="M 14 34 C 24 33, 36 33.5, 46 34.5" />
      <path class="kanji-stroke" d="M 30 12 C 29.5 32, 30 55, 30 88" />
      <path class="kanji-stroke" d="M 30 42 C 25 50, 20 58, 16 66" />
      <path class="kanji-stroke" d="M 30 42 C 35 50, 40 58, 44 66" />
      <path class="kanji-stroke" d="M 76 14 C 68 20, 62 26, 58 32" />
      <path class="kanji-stroke" d="M 86 40 C 76 47, 68 54, 62 60" />
      <path class="kanji-stroke" d="M 96 68 C 84 76, 74 82, 66 90" />
    </g>
    <circle id="brush-tip" r="4.2" fill="#ffffff" opacity="0" />
  </svg>
  <div id="splash-word"><span class="word-sugi">Sugi</span><span class="word-paint">Paint</span></div>
</div>

<div id="app">

  <header id="topbar">
    <div class="brand">
      <img class="brand-icon" src="icon.svg" alt="" aria-hidden="true" />
      <span class="brand-name"><span class="word-sugi">Sugi</span><span class="word-paint">Paint</span></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-undo" aria-label="Undo" title="Undo">↩️</button>
      <button class="icon-btn" id="btn-clear" aria-label="Clear everything" title="Clear">🧹</button>
      <button class="icon-btn" id="btn-save" aria-label="Save my picture" title="Save">📥</button>
      <button class="icon-btn" id="btn-sound" aria-label="Toggle sound" title="Sound">🔊</button>
    </div>
  </header>

  <main id="canvas-wrap">
    <canvas id="board"></canvas>
    <div id="confetti-layer" aria-hidden="true"></div>
  </main>

  <footer id="toolbar">

    <div class="row" id="tool-row">
      <button class="tool-btn is-active" data-tool="brush" aria-label="Brush" title="Brush">🖌️</button>
      <button class="tool-btn" data-tool="stamp" aria-label="Stickers" title="Stickers">⭐</button>
      <button class="tool-btn" data-tool="eraser" aria-label="Eraser" title="Eraser">🧽</button>

      <span class="divider" aria-hidden="true"></span>

      <button class="size-btn" data-size="small" aria-label="Small brush" title="Small">
        <span class="dot dot-s"></span>
      </button>
      <button class="size-btn is-active" data-size="medium" aria-label="Medium brush" title="Medium">
        <span class="dot dot-m"></span>
      </button>
      <button class="size-btn" data-size="large" aria-label="Large brush" title="Large">
        <span class="dot dot-l"></span>
      </button>
    </div>

    <div class="row" id="color-row" aria-label="Colors">
      <!-- filled by JS -->
    </div>

    <div class="row" id="stamp-row" aria-label="Stickers" hidden>
      <!-- filled by JS -->
    </div>

  </footer>

</div>

<script src="splash.js"></script>
<script src="app.js"></script>
</body>
</html>
